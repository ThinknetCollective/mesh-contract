[package]
name = "leaderboard"
version = "0.1.0"
edition = "2021"
description = "Global leaderboard with local file caching and CLI support"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"
